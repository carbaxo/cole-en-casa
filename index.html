<!doctype html>
<html lang="ca" data-kid="home">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a9b8c8">
<title>Cole en casa</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cole en casa">
<link rel="stylesheet" href="shared/glass.css">
<style>
.hometop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.adminbtn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;text-decoration:none;font-weight:800;font-size:.8rem;
  color:var(--muted,#4d6079);background:rgba(255,255,255,.45);border:1px solid rgba(35,55,85,.14);-webkit-tap-highlight-color:transparent}
.adminbtn:hover{background:rgba(255,255,255,.75);color:var(--ink,#1c2b41)}
@media (max-width:300px){.adminbtn span{display:none}.adminbtn{padding:8px}}
</style>
</head>
<body>
<div class="home-wrap">
  <div class="hometop">
    <span class="eyebrow" id="fam" style="-webkit-user-select:none;user-select:none;-webkit-touch-callout:none">Cole en casa</span>
    <a class="adminbtn" href="familia/" aria-label="Administrador: evolució del Mario i l'Oliver"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span>Administrador</span></a>
  </div>
  <h1>Qui estudia avui?</h1>
  <p class="muted" style="font-weight:700">Tria el teu nom per entrar al teu escriptori.</p>
  <div class="profiles">
    <a class="glass profile" href="mario/"><span class="avatar" style="--cc:#5872c9" aria-hidden="true">M<img data-av="mario" alt="" hidden></span><span class="tt">Mario</span><span class="grade">6è de primària</span></a>
    <a class="glass profile" href="oliver/"><span class="avatar" style="--cc:#3a9585" aria-hidden="true">O<img data-av="oliver" alt="" hidden></span><span class="tt">Oliver</span><span class="grade">4t de primària</span></a>
  </div>
</div>
<script>
/* avatar triat a l'escriptori de cada nen (localStorage cec-avatar-<nen>) */
function avatars(){document.querySelectorAll('img[data-av]').forEach(i=>{let a=null;try{a=localStorage.getItem('cec-avatar-'+i.dataset.av)}catch(e){}
  i.onerror=()=>{i.hidden=true};if(a){i.src='shared/avatars/'+a+'.webp';i.hidden=false}else i.hidden=true})}
avatars();addEventListener('pageshow',avatars);
/* entrada amagada al tauler de família: mantén premut «Cole en casa» 2 segons */
(function(){const el=document.getElementById('fam');let t=null;const stop=()=>clearTimeout(t);
  el.addEventListener('pointerdown',()=>{stop();t=setTimeout(()=>{location.href='familia/'},2000)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,stop));
  el.addEventListener('contextmenu',e=>e.preventDefault())})();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body>
</html>
