name: Desplegar en GitHub Pages

# Cada canvi a main es publica a GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Un solo despliegue a la vez; si llegan varios, se queda el último.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    # Publica sempre des de main.
    if: github.event_name == 'workflow_dispatch' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # El sitio es estático: no hay build. Se sube la raíz del repositorio
      # tal cual, con .nojekyll para que Pages no reprocese nada.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
