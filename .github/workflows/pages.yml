name: Desplegar en GitHub Pages

# Cada canvi a main es publica a GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Un solo despliegue a la vez; si llegan varios, se queda el último.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # El sitio es estático: no hay build. Se sube la raíz del repositorio
  # tal cual, con .nojekyll para que Pages no reprocese nada.
  build:
    # Publica sempre des de main.
    if: github.event_name == 'workflow_dispatch' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

  # El despliegue va en otro job: si deploy-pages busca el artefacto justo
  # después de subirlo, a veces GitHub aún no lo lista («No artifacts named
  # "github-pages" were found»). Si aun así falla, espera y lo reintenta.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
