name: Desplegar en GitHub Pages

# Se escuchan todas las ramas y se filtra en el job: así el despliegue sigue a
# la rama por defecto del repositorio se llame como se llame, y no se rompe si
# más adelante se renombra a main.
on:
  push:
    branches: ['**']
  workflow_dispatch:

# Un solo despliegue a la vez; si llegan varios, se queda el último.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    # Solo publica la rama por defecto. Las demás se construyen igual pero no
    # pisan el sitio en producción.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # El sitio es estático: no hay build. Se sube la raíz del repositorio
      # tal cual, con .nojekyll para que Pages no reprocese nada.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
